<h2 mat-dialog-title>Creación de adeudo desde catálogo</h2>
<mat-dialog-content>
  <mat-form-field class="w-full">
    <mat-label>Seleccione una cuota</mat-label>
    <mat-select
      [value]="selectedFeeId()"
      (valueChange)="onFeeChange($event)"
      multiLineOption
    >
      @for (fee of fees(); track fee.id) {
      <mat-option [value]="fee.id">
        <h4 mat-line>{{ fee.name }}</h4>
        <p mat-line class="text-sm text-gray-500">
          {{ fee.amount| currency:'MXN' }} - {{ fee.frequency | frequency }}
        </p>
      </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-accordion multi>
    @for (debit of debits(); track $index + debit.description) {
    <app-debit-with-discount-form
      [debit]="debit"
      [index]="$index"
      (remove)="removeDebit($index)"
      (update)="updateDebit($index, $event)"
    />
    }
  </mat-accordion>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading()">Cancelar</button>
  <button mat-button cdkFocusInitial (click)="submit()" [disabled]="loading()">
    {{ loading() ? "Guardando..." : "Guardar" }}
  </button>
</mat-dialog-actions>
